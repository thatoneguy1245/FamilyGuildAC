name: Deploy FamilyGuild

# Manual only. The runner is root on Unraid and can control host Docker.
# The Tower folder is not a git checkout, so files come from this runner's own
# checkout (actions/checkout). Nothing runs "git pull" on the server.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check to only verify paths and list what would change.
        required: false
        type: boolean
        default: true
      apply_sql:
        description: Also apply sql/custom/0*-8* (not 90_) to acore_world (backs up first).
        required: false
        type: boolean
        default: false
      build_images:
        description: Build the :familyguild images on Tower (build only; no .env change, no restart). Skips the normal deploy.
        required: false
        type: boolean
        default: false
      diagnose:
        description: Read-only report of Docker storage, disks, CPU, RAM and write speed. Changes nothing.
        required: false
        type: boolean
        default: false
      skip_modules:
        description: Space-separated module folder names to leave out of the build (ones that fail to compile).
        required: false
        type: string
        default: ""

concurrency:
  group: familyguild-unraid
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.build_images != true && inputs.diagnose != true }}
    runs-on: [self-hosted, linux, familyguild-deploy]
    steps:
      - name: Refuse anything but master
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/master" ]; then
            echo "Refusing ${GITHUB_REF:-<unset>}. This runner only deploys master."
            exit 1
          fi

      - name: Check out the repo into the runner's work folder
        uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false

      - name: Deploy, or dry-run
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          APPLY_SQL: ${{ inputs.apply_sql == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          srv=/mnt/user/Rompecuori/FamilyGuild
          src="$GITHUB_WORKSPACE/src"

          command -v docker >/dev/null
          test -f "$srv/.env"
          test -f "$srv/docker-compose.yml"
          test -d "$src/scripts/lua/familyguild"
          test -d "$src/sql/custom"
          cd "$srv"
          docker compose ps --services | grep -qx ac-worldserver
          echo "Paths exist. Compose project found at $srv."

          echo "Would copy from the checkout (${GITHUB_SHA:0:7}):"
          echo "  scripts/lua/familyguild/ -> $srv/scripts/lua/familyguild/"
          echo "  sql/custom/              -> $srv/sql/custom/"
          echo "  build/*.sh, build/*.yml  -> $srv/build/ (build/src is never touched)"
          diff -rq "$src/scripts/lua/familyguild" "$srv/scripts/lua/familyguild" || true
          diff -rq "$src/sql/custom" "$srv/sql/custom" || true
          if [ "$APPLY_SQL" = "true" ]; then
            echo "Would back up the 3 databases to $srv/backups/, then apply:"
            ls "$src"/sql/custom/[0-8]*.sql
          fi
          echo "Would restart ac-worldserver. .env and compose files are never changed."

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run. Nothing was changed."
            exit 0
          fi

          mkdir -p scripts/lua/familyguild sql/custom build backups
          cp -a "$src/scripts/lua/familyguild/." scripts/lua/familyguild/
          cp -a "$src/sql/custom/." sql/custom/
          cp -a "$src"/build/*.sh "$src"/build/*.yml build/ 2>/dev/null || true

          if [ "$APPLY_SQL" = "true" ]; then
            DBPW=$(grep ^DOCKER_DB_ROOT_PASSWORD= .env | cut -d= -f2)
            out=backups/fg-$(date +%F-%H%M)-predeploy.sql
            docker compose exec -T ac-database mysqldump -uroot -p"$DBPW" \
              --databases acore_auth acore_characters acore_world > "$out"
            ls -lh "$out"
            for f in sql/custom/[0-8]*.sql; do
              echo "Applying $f"
              docker compose exec -T ac-database mysql -uroot -p"$DBPW" acore_world < "$f"
            done
          fi

          docker compose restart ac-worldserver
          for _ in $(seq 1 30); do
            state=$(docker compose ps --format '{{.State}}' ac-worldserver || true)
            [ "$state" = "running" ] && break
            sleep 2
          done
          docker compose ps ac-worldserver
          if [ "$state" != "running" ]; then
            docker compose logs --tail 200 ac-worldserver || true
            exit 1
          fi
          sleep 20
          docker compose logs --tail 40 ac-worldserver | grep -i -E "ale|eluna|lua|error" || true
          echo "Deployed. ac-worldserver is running."

  build:
    if: ${{ inputs.build_images == true && inputs.diagnose != true }}
    runs-on: [self-hosted, linux, familyguild-deploy]
    timeout-minutes: 360
    steps:
      - name: Refuse anything but master
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/master" ]; then
            echo "Refusing ${GITHUB_REF:-<unset>}. This runner only builds master."
            exit 1
          fi

      - name: Check out the repo into the runner's work folder
        uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false

      - name: Build :familyguild images, or dry-run
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          SKIP_MODULES: ${{ inputs.skip_modules }}
        run: |
          set -euo pipefail
          srv=/mnt/user/Rompecuori/FamilyGuild
          src="$GITHUB_WORKSPACE/src"
          command -v docker >/dev/null
          test -f "$src/build/build-familyguild.sh"
          test -d "$srv"
          cd "$srv"
          echo "Free space on $srv:"; df -h "$srv" | tail -1
          echo "Current images:"; docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'acore|ac-wotlk' || true
          echo "Running stack tag (not changed): $(grep ^DOCKER_IMAGE_TAG= .env || echo 'unset (master)')"
          echo "Would copy build/*.sh, build/*.yml to $srv/build/ and run build/build-familyguild.sh"
          echo "SKIP_MODULES='${SKIP_MODULES}'"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run. Nothing was changed."
            exit 0
          fi
          mkdir -p build
          cp -a "$src"/build/*.sh "$src"/build/*.yml build/
          start=$(date +%s)
          set +e
          bash build/build-familyguild.sh 2>&1 | tee build/build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "Build took $(( ($(date +%s)-start)/60 )) min, exit $rc"
          if [ "$rc" != 0 ]; then
            echo "---- error lines ----"
            grep -n -E "error:|Error [0-9]|modules/mod-[a-z-]+" build/build.log | grep -i error | tail -60 || true
            exit "$rc"
          fi
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedSince}}' | grep ':familyguild'

  diagnose:
    if: ${{ inputs.diagnose == true }}
    runs-on: [self-hosted, linux, familyguild-deploy]
    timeout-minutes: 20
    steps:
      - name: Read-only diagnostics
        run: |
          set +e
          echo "== docker info =="; docker info 2>/dev/null | grep -E "Storage Driver|Docker Root Dir|Backing Filesystem|CPUs|Total Memory|Server Version"
          root=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null)
          echo "== df =="; df -h "$root" /var/lib/docker /mnt/cache /mnt/user/Rompecuori 2>&1
          echo "== mounts =="; mount | grep -E "docker|/mnt/cache|loop" | head -20
          echo "== /mnt/cache exists? =="; ls -ld /mnt/cache 2>&1; ls /mnt/cache 2>&1 | head -30
          echo "== pools =="; ls -d /mnt/*/ 2>&1
          echo "== docker.cfg =="; grep -E "DOCKER_IMAGE_FILE|DOCKER_IMAGE_TYPE|DOCKER_IMAGE_SIZE|DOCKER_ENABLED" /boot/config/docker.cfg 2>&1
          echo "== share config =="; for f in /boot/config/shares/Rompecuori.cfg /boot/config/shares/system.cfg; do echo "-- $f"; grep -E "shareUseCache|shareCachePool|shareCachePool2" "$f" 2>&1; done
          echo "== CPU/RAM =="; nproc; free -h; uptime
          echo "== disks =="; lsblk -d -o NAME,SIZE,ROTA,MODEL 2>&1
          for d in "$root" /mnt/user/Rompecuori /mnt/cache; do
            [ -d "$d" ] || { echo "skip $d"; continue; }
            f="$d/.fg-ddtest-$$"
            echo "== dd 512MB write in $d =="
            timeout 300 dd if=/dev/zero of="$f" bs=1M count=512 conv=fdatasync 2>&1 | tail -1
            rm -f "$f"
          done
          echo "Diagnostics done. Nothing was changed."
