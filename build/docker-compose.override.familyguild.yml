# Use with the :familyguild images (DOCKER_IMAGE_TAG=familyguild in .env).
# Copy over docker-compose.override.yml. The extra lines are ignored by stock images.
services:
  ac-worldserver:
    environment:
      AC_RATE_XP_KILL: "3"
      AC_RATE_XP_QUEST: "3"
      AC_RATE_XP_EXPLORE: "3"
      AC_RATE_DROP_MONEY: "2"
      AC_PLAYER_INSTANT_FLIGHT: "1"
      AC_SKIP_CINEMATICS: "2"
      AC_MAP_UPDATE_THREADS: "4"
      AC_ALE_SCRIPT_PATH: "/azerothcore/env/dist/bin/lua_scripts"
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_playerbots"
      AC_PLAYERBOTS_RANDOM_BOT_AUTOLOGIN: "1"
      AC_PLAYERBOTS_MIN_RANDOM_BOTS: "20"
      AC_PLAYERBOTS_MAX_RANDOM_BOTS: "40"
      AC_PLAYERBOTS_ENABLE_BROADCASTS: "0"
      AC_AUCTION_HOUSE_BOT_ENABLE_SELLER: "0"
      AC_AUCTION_HOUSE_BOT_ACCOUNT: "0"
      AC_AUCTION_HOUSE_BOT_GUID: "0"
      AC_SKIP_DEATHKNIGHT_STARTER_ENABLE: "1"
  ac-db-import:
    environment:
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_playerbots"
